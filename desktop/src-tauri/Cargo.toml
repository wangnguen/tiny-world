[package]
name = "tinyworld"
version = "0.1.0"
description = "TinyWorld desktop pet"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
# Overlay vẽ bằng DirectComposition: tiến trình chính của app.
tinyworld-native = { path = "../../native" }
# Cài đặt, chữ, chat, kiểu dữ liệu dùng chung với overlay.
tinyworld-backend = { path = "../backend" }
# Đã có sẵn qua Tauri; chờ overlay trả lời command (ui.rs).
tokio = { version = "1", features = ["sync"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }
