# Mỗi lần push lên main: kiểm tra code rồi build file .exe cho Windows.
# Tải về: GitHub → tab Actions → bấm vào lần chạy → mục Artifacts ở cuối trang, mỗi file .exe là một
# artifact tải thẳng về, không phải zip (giữ 30 ngày).
# Phát hành chính thức lên trang Releases thì dùng workflow Release (release.yml, chạy tay).
name: Build

on:
  push:
    # Nhánh test tạo artifact .exe để kiểm thử trước khi merge vào main.
    branches: [main, test]
    # Push chỉ sửa tài liệu thì không build lại. Không bỏ qua assets/: sprite và icon được build vào app.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/workflows/release.yml"
  # Cho phép bấm chạy tay ở tab Actions khi cần build lại.
  workflow_dispatch:

permissions:
  contents: read

# Push liên tục thì huỷ lần build cũ, chỉ giữ lần mới nhất.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tạo icon TinyWorld
        run: pnpm icons:desktop
      - run: pnpm typecheck
      - run: pnpm test
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      # Tauri cần thư mục dist của frontend lúc compile test.
      - run: pnpm --filter desktop build
      - run: cargo test --locked
        working-directory: desktop/src-tauri
      # Ghi version của bản sắp phát hành vào tauri.conf.json, chỉ trên máy build (không sửa file trong
      # repo), để tên file tải về và dòng version trong Cài đặt khớp với bản Release: commit này đã được
      # phát hành thì lấy đúng version đó, chưa thì tăng số cuối của release mới nhất (v1.3.2 → 1.3.3).
      - name: Ghi version
        shell: bash
        run: |
          conf=desktop/src-tauri/tauri.conf.json
          # Checkout chỉ lấy một commit, không kèm tag: hỏi thẳng GitHub. Tag có chú thích có thêm dòng
          # `<tag>^{}` trỏ vào commit, bỏ hậu tố đó đi.
          refs=$(git ls-remote --tags origin | sed 's/\^{}$//')
          # Version release mới nhất (tag v<x.y.z>, bỏ tag nháp kiểu untagged-...). `$1` khác rỗng: chỉ xét
          # tag trỏ vào commit đó.
          latest() {
            printf '%s\n' "$refs" |
              awk -v sha="$1" 'sha == "" || $1 == sha { sub("refs/tags/v", "", $2); print $2 }' |
              { grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true; } |
              sort -uV | tail -n 1
          }
          current=$(latest "$GITHUB_SHA")
          previous=$(latest "")
          if [ -n "$current" ]; then
            version=$current
          elif [ -n "$previous" ]; then
            version=$(echo "$previous" | awk -F. '{ print $1 "." $2 "." $3 + 1 }')
          else
            version=$(jq -r .version "$conf")
          fi
          echo "Version: $version"
          jq --arg v "$version" '.version = $v' "$conf" > "$conf.tmp" && mv "$conf.tmp" "$conf"
          # Cài đặt hiện thêm số lần chạy và commit, để phân biệt với bản Release cùng version.
          echo "VITE_BUILD=${{ github.run_number }} · ${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Build .exe
        run: pnpm build:desktop

      - name: Chuẩn bị file tải về
        id: files
        shell: bash
        run: |
          version=$(jq -r .version desktop/src-tauri/tauri.conf.json)
          # Tên artifact là tên file (xem bước upload): kèm số lần chạy và commit để phân biệt các bản build.
          build="TinyWorld_${version}-${{ github.run_number }}-${GITHUB_SHA::7}_x64"
          mkdir -p out
          # Bản cài đặt (NSIS) và bản chạy thẳng không cần cài (cần WebView2, Windows 10/11 có sẵn).
          cp desktop/src-tauri/target/release/bundle/nsis/*-setup.exe "out/${build}-setup.exe"
          cp desktop/src-tauri/target/release/tinyworld.exe "out/${build}-portable.exe"
          echo "setup=out/${build}-setup.exe" >> "$GITHUB_OUTPUT"
          echo "portable=out/${build}-portable.exe" >> "$GITHUB_OUTPUT"

      # Mỗi file một artifact, không nén. Nén chung thành zip thì Explorer vẽ file exe nằm trong zip bằng
      # icon exe chung (không đọc icon trong file), trông như app mất icon. Không nén thì mỗi artifact chỉ
      # được một file, tên artifact là tên file (`name` bị bỏ qua).
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.files.outputs.setup }}
          archive: false
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.files.outputs.portable }}
          archive: false
          if-no-files-found: error
          retention-days: 30
